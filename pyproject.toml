[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "futureshow"
version = "0.1.0"
description = "Benchmarking AI agents for predicting future"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "HKUDS" }
]
dependencies = [
  "openai-agents[litellm]",
  "fastmcp>=0.3.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.5.0",
  "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["futureshow"]

[tool.hatch.build.targets.sdist]
include = [
  "futureshow/**",
  "README.md",
  "LICENSE",
]


